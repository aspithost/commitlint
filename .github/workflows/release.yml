name: Release

on:
  push:
    branches: [main]

jobs:
  build:
    uses: aspithost/actions/.github/workflows/node-cicd.yml@v2
    permissions:
      contents: write
      id-token: write
    with:
      test-command: npm run test:cov:ci
      run-sonar: true
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
