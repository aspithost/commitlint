name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    uses: aspithost/actions/.github/workflows/node-ci.yml@v2
    permissions:
      contents: read
      pull-requests: write
    with:
      test-command: npm run test:cov:ci
      upload-vitest-coverage-report: true
      run-sonar: true
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
