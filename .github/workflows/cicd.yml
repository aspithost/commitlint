name: CICD

on:
  push:
    branches: [main]

jobs:
  cicd:
    uses: aspithost/actions/.github/workflows/node-cicd.yml@v3
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    with:
      run-sonar: true
      test-command: npm run test:cov:ci
      upload-coverage-report: true
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
